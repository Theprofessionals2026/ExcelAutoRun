name: ApplicantStack smart incremental sync

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode"
        required: true
        type: choice
        options:
          - incremental
          - manual_range
        default: incremental
      start_page:
        description: "Start page (manual_range only)"
        required: false
        default: "1"
      end_page:
        description: "End page (manual_range only)"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: applicantstack-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ApplicantStack sync
        env:
          API_TOKEN: ${{ secrets.APPLICANTSTACK_TOKEN }}
          API_PUBLISHER: ${{ secrets.APPLICANTSTACK_PUBLISHER }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode || 'incremental' }}
          START_PAGE: ${{ inputs.start_page }}
          END_PAGE: ${{ inputs.end_page }}
          MAX_WORKERS: "8"
          STOP_AFTER_KNOWN_PAGES: "5"
          MAX_INCREMENTAL_PAGES: "100"
        run: python applicantstack_scraper.py

      - name: List outputs
        if: always()
        run: |
          mkdir -p exports
          ls -la exports || true
          ls -la applicantstack_state.json applicantstack_seen_ids.txt 2>/dev/null || true

      - name: Prepare Excel generated by this run
        if: always()
        run: |
          mkdir -p run_artifact
          git status --porcelain -- exports/ | while read -r status file; do
            case "$file" in
              *.xlsx) cp "$file" run_artifact/ ;;
            esac
          done

      - name: Commit new exports and checkpoints
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A exports applicantstack_state.json applicantstack_seen_ids.txt
          git diff --cached --quiet || git commit -m "ApplicantStack sync @ $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: Upload Excel generated by this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applicantstack-excel-${{ github.run_number }}
          path: run_artifact/*.xlsx
          if-no-files-found: ignore
          retention-days: 14
